:root{--bg:#0B0E13;--card:#121720;--lime:#00CFEA;--mu:#8995A5;--bd:#252E3B;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

button.p,nav button.on{background:var(--lime);color:#0B0E13;border-color:var(--lime);font-weight:700}
main{max-width:980px;margin:0 auto;padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}

.mu{color:var(--mu)}.big{font-size:64px;font-weight:800;color:var(--lime);line-height:1}

.bars{display:flex;gap:6px;align-items:flex-end;height:120px}.bars div{flex:1;background:#2b3646;border-radius:4px 4px 0 0;position:relative}.bars div.s{background:var(--lime)}
.hr{display:grid;grid-template-columns:1fr 1fr;margin-bottom:14px;background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;transition:border-color .15s}.hr:hover{border-color:var(--lime)}.hr .card{display:flex;flex-direction:column;align-items:flex-start;justify-content:center}.hr .card{border:0;border-radius:0;background:none;padding:22px}.hr .tc:hover{transform:none}.vs{position:relative;min-height:220px;background:#000;cursor:pointer}.vs video{position:absolute;inset:0;width:100%;height:100%;max-height:none;object-fit:cover;border-radius:0}.slot{height:100%;min-height:180px;border:1px dashed #2b3646;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mu);text-align:center;padding:12px}@media(max-width:640px){.hr{grid-template-columns:1fr}}
.tl{position:relative;height:46px;margin-top:8px;background:#181F2A;border:1px solid var(--bd);border-radius:10px;cursor:pointer;touch-action:none;overflow:hidden}.tl .m{position:absolute;top:0;bottom:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none}.tl .m b{font-size:14px;line-height:1.1}.tl .m i{flex:1;width:2px;background:currentColor;opacity:.8}#ph{position:absolute;top:0;bottom:0;width:2px;background:#fff;pointer-events:none}

.gc{margin-bottom:14px}.gh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.badge{background:rgba(0,207,234,.14);color:#00CFEA;border-radius:99px;padding:2px 10px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.stats span{display:block;color:var(--mu);font-size:12px}.stats b{font-size:22px}.ch{width:100%;height:170px;overflow:hidden}.ch svg{display:block}details summary{cursor:pointer;color:var(--mu);padding:10px 0}.rw{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--bd)}.rw .v{margin-left:auto;font-weight:700}@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}.rw .v{margin-left:0}}
.og{margin:12px 0 0}.ol{color:var(--mu);font-size:13px;margin-bottom:6px}.og .opts{margin:0}
.pf .card{background:#12161d;border-color:#2C3440}.pbar{height:10px;border-radius:99px;background:#2C3440;overflow:hidden;margin:6px 0}.pbar i{display:block;height:100%;background:linear-gradient(90deg,#00CFEA,#3478F6);transition:width .6s}.erb{display:flex;height:20px;border-radius:99px;overflow:hidden;margin:10px 0}.erb i{transition:width .6s}.pr{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid #2C3440}.pf h3{margin:0 0 8px;font-size:16px}
.pf{--cd:#121720;--s2:#181F2A;--bd:#252E3B;--cy:#00CFEA;--bl:#3478F6;--tx:#F4F7FB;--mu:#8995A5;font-family:Manrope,Inter,system-ui,sans-serif;color:var(--tx);font-variant-numeric:tabular-nums;animation:fi .4s ease both}

.pn{font-size:12px;font-weight:600;color:var(--mu)}.pv{font-size:30px;font-weight:700;line-height:1.1;margin-top:10px}.pv small{font-size:12px;color:var(--mu);font-weight:500;margin-left:4px}

const vid=u=>`<video src="${u}" loop muted playsinline preload="none"${PM.get(u)?` poster="${PM.get(u)}"`:''}></video>`;
const vrow=(k,t,d,m)=>`<div class="hr"><div class="card tc" data-k="${k}"><b style="font-size:18px">${t}</b><p class="mu">${d}</p></div><div class="vs">${m}</div></div>`;
function wire(){M.querySelectorAll('.hr').forEach(r=>{const v=r.querySelector('video');if(!v)return;v.addEventListener('loadeddata',()=>{v.currentTime=.05});r.onmouseenter=()=>v.play().catch(()=>{});r.onmouseleave=()=>{v.pause();v.currentTime=.05};r.querySelector('.vs').onclick=()=>v.paused?v.play().catch(()=>{}):v.pause()});M.querySelectorAll('.tc').forEach(e=>e.onclick=()=>setup(e.dataset.k))}
function choose(){S=null;M.innerHTML='<button id=bk>← Tests</button><h2>Vertical Jump</h2>'+vrow('cmj','Countermovement Jump (CMJ)',T.cmj.d,vid(DEMO))+vrow('sj','Squat Jump (SJ)',T.sj.d,vid(DEMO_SJ))+vrow('rj2','Approach Vertical Jump (AVJ)',T.rj2.d,vid(DEMO_RJ));$('#bk').onclick=home;wire()}
